<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Signage Kiosk Viewer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Stage with Double Buffering Layers for Smooth Transitions -->
  <div id="stage">
    <div id="layer-a" class="layer active"></div>
    <div id="layer-b" class="layer"></div>
  </div>

  <!-- HUD Overlay -->
  <div id="hud-overlay">
    <div id="status-indicator" class="status-dot"></div>
    <div id="hud-clock" class="hud-time">00:00:00</div>
  </div>

  <!-- Push URL Container -->
  <div id="push-frame-container">
    <iframe id="push-iframe" src="about:blank" allow="autoplay; fullscreen"></iframe>
  </div>

  <!-- Screen Blank Overlay -->
  <div id="blank-overlay"></div>

  <!-- Emergency Overlay -->
  <div id="emergency-overlay">
    <div class="alert-title" id="alert-title">⚠️ EMERGENCY ALERT</div>
    <div class="alert-message" id="alert-message">Please follow security staff instructions immediately.</div>
  </div>

  <!-- Pairing / Unpaired Screen -->
  <div id="pairing-overlay">
    <div class="pairing-card">
      <div class="pairing-badge">⚡ Device Pairing</div>
      <h1 class="pairing-title">Display Unpaired</h1>
      <p class="pairing-sub">
        To associate this screen with the orchestrator, enter the PIN code below on the web dashboard:
      </p>

      <div class="pairing-code-box">
        <div class="pairing-code-label">PAIRING CODE</div>
        <div class="pairing-code-value" id="pairing-code-display">--- ---</div>
      </div>

      <div class="pairing-meta">
        <div class="pairing-meta-item">Device: <strong id="pairing-device-name">Signage Node</strong></div>
        <div class="pairing-meta-item">UUID: <strong id="pairing-device-uuid">--------</strong></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
