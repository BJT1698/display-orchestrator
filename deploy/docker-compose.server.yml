services:
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: display-orchestrator-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - MEDIA_DIR=/media
      - HEARTBEAT_TIMEOUT_MS=30000
    volumes:
      - ../data:/data
      - ../media:/media
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
